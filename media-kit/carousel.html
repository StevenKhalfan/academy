<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مختبر التداول — كاروسيل</title>
<style>
:root{--bg:#0A0E27;--card:#141A3A;--border:#252C55;--p:#6C5CE7;--c:#00D9FF;--g:#00F5A0;--t:#EEF1FF;--m:#A8B0D6;--grad:linear-gradient(135deg,#6C5CE7,#00D9FF)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
body{font-family:'TajawalL','Tajawal',sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:
  radial-gradient(700px 520px at 88% 6%,rgba(108,92,231,.34),transparent 70%),
  radial-gradient(640px 520px at 6% 96%,rgba(0,217,255,.20),transparent 70%),var(--bg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(37,44,85,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(37,44,85,.55) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(900px 800px at 50% 45%,#000 20%,transparent 75%);opacity:.55}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* top bar */
.top{position:absolute;top:56px;right:64px;left:64px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px}
.logo .mk{width:50px;height:50px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(108,92,231,.45)}
.count{font-weight:700;font-size:24px;color:var(--m);direction:ltr;letter-spacing:2px}
.count b{color:var(--t)}
/* bottom signature */
.sig{position:absolute;bottom:44px;right:64px;left:64px;display:flex;align-items:center;justify-content:space-between;z-index:5;font-size:23px;color:var(--m);font-weight:500}
.sig .h{direction:ltr;unicode-bidi:isolate;font-weight:700;color:var(--t);opacity:.9}
.sig .h i{font-style:normal;color:var(--c);margin:0 8px}
.sig .ln{flex:1;height:1px;background:var(--border);margin:0 24px}
/* phone */
.phone{position:relative;border-radius:74px;padding:16px;background:linear-gradient(160deg,#2a3166,#0d1130 45%,#1b2150);box-shadow:0 0 0 2px #313a72 inset,0 50px 90px rgba(0,0,0,.55),0 0 120px rgba(108,92,231,.30)}
.phone .scr{position:relative;border-radius:58px;overflow:hidden;background:#0d1130;aspect-ratio:1170/2532}
.phone .scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.phone .isl{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:30%;height:30px;border-radius:20px;background:#000;z-index:2}
.phone .miss{position:absolute;inset:0;display:grid;place-items:center;color:var(--m);font-size:28px;background:var(--grad);opacity:.35}
/* common text */
.kick{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;border:1px solid var(--border);background:rgba(20,26,58,.8);color:var(--c);font-weight:700;font-size:26px}
.kick .dot{width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g)}
h1,h2{font-weight:800;line-height:1.25}
.sub{color:var(--m);font-size:32px;line-height:1.65;font-weight:500}
/* cover */
.cover .txt{position:absolute;top:168px;right:64px;left:64px}
.cover h1{font-size:150px;font-weight:900;line-height:1.15;margin:26px 0 16px;letter-spacing:-1px}
.cover .sub{font-size:36px;max-width:900px}
.cover .chart{position:absolute;left:0;right:0;top:600px;height:440px;opacity:.85}
.cover .clip{position:absolute;left:0;width:620px;top:560px;height:670px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent)}
.cover .ph{position:absolute;left:110px;top:40px;width:400px;transform:rotate(-7deg)}
.cover .chips{position:absolute;right:64px;bottom:200px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.chip{display:flex;align-items:center;gap:14px;padding:16px 26px;border-radius:20px;background:rgba(20,26,58,.88);border:1px solid var(--border);font-weight:700;font-size:28px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.chip svg{flex:none}
.swipe{position:absolute;right:64px;bottom:110px;display:none}
/* problem */
.prob .txt,.trk .txt,.cta .txt{position:absolute;top:140px;bottom:110px;right:64px;left:64px;display:flex;flex-direction:column;justify-content:center}
.prob h2{font-size:100px;margin:0 0 56px}
.pt{min-height:150px}
.pt{display:flex;align-items:center;gap:26px;padding:30px 34px;margin-bottom:22px;border-radius:26px;background:var(--card);border:1px solid var(--border);font-size:40px;font-weight:700}
.pt .ic{flex:none;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;background:rgba(108,92,231,.16);border:1px solid rgba(108,92,231,.5)}
.ans{margin-top:44px;padding:3px;border-radius:30px;background:var(--grad)}
.ans div{border-radius:27px;background:#0f1433;padding:30px 36px;display:flex;align-items:center;justify-content:space-between;font-size:40px;font-weight:800}
.ans small{font-size:28px;color:var(--m);font-weight:500}
/* shot */
.shot .txt{position:absolute;top:0;bottom:0;right:64px;width:440px;display:flex;flex-direction:column;justify-content:center}
.shot .num{font-weight:900;font-size:120px;line-height:1;opacity:.95;margin-bottom:18px;direction:ltr;text-align:right}
.shot h2{font-size:66px;margin-bottom:26px}
.shot .bar{width:90px;height:8px;border-radius:8px;background:var(--grad);margin-bottom:30px}
.shot .sub{font-size:32px}
.shot .ph{position:absolute;left:66px;top:150px;width:480px}
.shot .glow{position:absolute;left:30px;top:300px;width:540px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,217,255,.25),transparent);filter:blur(10px)}
/* tracks */
.trk h2{font-size:80px;margin-bottom:42px}
.row{display:flex;align-items:center;gap:28px;padding:20px 28px;margin-bottom:18px;border-radius:26px;background:var(--card);border:1px solid var(--border)}
.row .ic{flex:none;width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(108,92,231,.28),rgba(0,217,255,.14));border:1px solid #39427c}
.row .nm{flex:1;font-size:42px;font-weight:800}
.row .ix{font-size:30px;font-weight:800;color:#4b5596;direction:ltr}
.note{display:flex;align-items:center;gap:16px;margin-top:30px;font-size:28px;color:var(--m);font-weight:500}
.note b{color:var(--g);font-weight:700}
/* cta */
.cta .txt{text-align:center}
.cta h2{font-size:78px;margin-bottom:10px}
.price{display:flex;align-items:baseline;justify-content:center;gap:22px;line-height:1;margin:10px 0 8px}
.price .n{font-size:250px;font-weight:900;letter-spacing:-4px}
.price .cur{font-size:84px;font-weight:800;color:var(--t)}
.plbl{font-size:30px;color:var(--m);margin:-6px 0 44px}
.bds{display:flex;flex-direction:column;gap:18px;text-align:right}
.bd{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 34px;border-radius:24px;background:var(--card);border:1px solid var(--border);font-size:32px;font-weight:700}
.bd .pr{flex:none;color:var(--g);font-weight:800;font-size:36px}
.go{margin-top:38px;display:flex;align-items:center;justify-content:center;gap:20px;padding:34px;border-radius:28px;background:var(--grad);font-size:48px;font-weight:900;color:#fff;box-shadow:0 24px 60px rgba(108,92,231,.45)}
.warn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:30px;font-size:25px;color:var(--m);font-weight:500;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const n = Math.max(1, parseInt(q.get('n') || '1', 10));
  const FONT = (window.__FONT_URL || 'fonts/').replace(/\/?$/, '/');
  const SHOTS = (window.__SHOTS_URL || 'shots/').replace(/\/?$/, '/');

  // fonts (file:// from FONT_DIR)
  const W = {300:'Light',400:'Regular',500:'Medium',700:'Bold',800:'ExtraBold',900:'Black'};
  const st = document.createElement('style');
  st.textContent = Object.entries(W).map(([w,f]) => `@font-face{font-family:'TajawalL';font-weight:${w};font-style:normal;src:url('${FONT}Tajawal-${f}.ttf') format('truetype')}`).join('\n');
  document.head.appendChild(st);

  let copy = window.__COPY;
  if (!copy) { try { copy = await (await fetch('copy.json')).json(); } catch (e) { copy = {carousel: []}; } }
  const slides = copy.carousel || [];
  const s = slides[n-1] || slides[0] || {};
  const total = slides.length || 7;
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const cover = slides.find(x => x.kind === 'cover') || {};
  const brand = cover.title || 'مختبر التداول';

  // ---------- icons (hand-drawn SVG) ----------
  const G = `<defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs>`;
  const ico = (body, sz=56, stroke='url(#ig)') => `<svg width="${sz}" height="${sz}" viewBox="0 0 48 48" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${G}${body}</svg>`;
  const I = {
    globe: '<circle cx="24" cy="24" r="17"/><ellipse cx="24" cy="24" rx="7.5" ry="17"/><path d="M7.5 18h33M7.5 30h33"/>',
    bourse: '<path d="M6 17 24 7l18 10z"/><path d="M10 21v15M18 21v15M30 21v15M38 21v15"/><path d="M6 40h36M8 36h32"/>',
    crypto: '<circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="11.5" stroke-width="2" opacity=".55"/><path d="M20 16v16M20 17h6a3.5 3.5 0 0 1 0 7h-6M20 24h7a4 4 0 0 1 0 8h-7M23 13.5v3M23 31.5v3"/>',
    fx: '<path d="M9 17h28M31 10l7 7-7 7"/><path d="M39 31H11M17 24l-7 7 7 7"/>',
    gold: '<path d="M5 40l3-9h13l3 9zM24 40l3-9h13l3 9zM14.5 31l3-9h13l3 9z"/><path d="M38 7v7M34.5 10.5h7" stroke-width="2.6"/>',
    chart: '<path d="M8 40h32"/><path d="M14 30v-8M24 26V12M34 32v-12"/><rect x="11" y="22" width="6" height="8" rx="1.5"/><rect x="21" y="14" width="6" height="12" rx="1.5"/><rect x="31" y="20" width="6" height="10" rx="1.5"/>',
    x: '<path d="M15 15l18 18M33 15 15 33"/>',
    send: '<path d="M42 6 20 28"/><path d="M42 6 29 42l-9-14-14-9z"/>',
    info: '<circle cx="24" cy="24" r="17"/><path d="M24 22v11M24 15.5v.5"/>',
    book: '<path d="M8 10h11a5 5 0 0 1 5 5v25a4 4 0 0 0-4-4H8zM40 10H29a5 5 0 0 0-5 5v25a4 4 0 0 1 4-4h12z"/>',
    calc: '<rect x="11" y="6" width="26" height="36" rx="4"/><rect x="16" y="11" width="16" height="7" rx="1.5"/><path d="M17 25h.1M24 25h.1M31 25h.1M17 31h.1M24 31h.1M31 31h.1M17 37h.1M24 37h7" stroke-width="3.6"/>',
    check: '<path d="M10 25l9 9 19-20"/>'
  };
  const trackIcon = name => /أسهم|stock/i.test(name) ? 'globe' : /مسقط|بورص|msx/i.test(name) ? 'bourse' : /رقمي|crypto/i.test(name) ? 'crypto' : /فوركس|forex|عملات/i.test(name) ? 'fx' : /ذهب|فض|gold/i.test(name) ? 'gold' : 'chart';
  const markSvg = `<svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M13 10v28M24 6v32M35 14v22"/><rect x="9.5" y="16" width="7" height="12" rx="1.5" fill="#fff"/><rect x="20.5" y="12" width="7" height="16" rx="1.5"/><rect x="31.5" y="19" width="7" height="11" rx="1.5" fill="#fff"/></svg>`;

  // ---------- candle chart (deterministic) ----------
  function candles(w, h, count, seed){
    let r = seed; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
    let v = 60, out = []; for (let i=0;i<count;i++){ const o=v; v += (rnd()-0.38)*14; const c=v; out.push([o,c,Math.max(o,c)+rnd()*7,Math.min(o,c)-rnd()*7]); }
    const all = out.flat(), mn = Math.min(...all), mx = Math.max(...all), y = x => h - 20 - (x-mn)/(mx-mn)*(h-40);
    const cw = w/count; let svg = '', line = '';
    out.forEach(([o,c,hi,lo],i)=>{ const up=c>=o, col=up?'#00F5A0':'#6C5CE7', x=i*cw+cw/2;
      svg += `<line x1="${x}" x2="${x}" y1="${y(hi)}" y2="${y(lo)}" stroke="${col}" stroke-width="2.5" opacity=".8"/><rect x="${x-cw*0.3}" y="${Math.min(y(o),y(c))}" width="${cw*0.6}" height="${Math.max(3,Math.abs(y(o)-y(c)))}" rx="3" fill="${col}" opacity="${up?.85:.75}"/>`;
      line += (i?'L':'M') + x + ' ' + y(c) + ' '; });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs>${svg}<path d="${line}" fill="none" stroke="url(#lg)" stroke-width="4" opacity=".9"/></svg>`;
  }

  const phone = (name) => `<div class="phone"><div class="scr"><div class="isl"></div><img src="${SHOTS}${esc(name)}.png" alt="" data-n="${esc(name)}"></div></div>`;
  const top = `<div class="grid"></div><div class="top"><div class="logo"><span class="mk">${markSvg}</span><span class="gt">${esc(brand)}</span></div><div class="count"><b>${String(n).padStart(2,'0')}</b> / ${String(total).padStart(2,'0')}</div></div>`;
  const sig = `<div class="sig"><span>${esc(copy.academy || 'أكاديمية ستيفن خلفان')}</span><span class="ln"></span><span class="h">@stevenkhalfan<i>×</i>@aiminute.om</span></div>`;

  let body = '';
  const shotIdx = slides.filter(x => x.kind === 'shot').indexOf(s);
  switch (s.kind) {
    case 'cover': {
      const chipSrc = slides.filter(x => x.kind === 'shot' || x.kind === 'tracks').slice(0,3);
      const chipIc = ['chart','book','globe'];
      body = `<div class="slide cover">${top}
        <div class="chart">${candles(1080,520,26,7)}</div>
        <div class="txt"><span class="kick"><span class="dot"></span>${esc(s.kicker)}</span><h1 class="gt">${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p></div>
        <div class="clip"><div class="ph">${phone(slides.find(x=>x.shot)?.shot || 'trade')}</div></div>
        <div class="chips">${chipSrc.map((c,i)=>`<div class="chip">${ico(I[c.kind==='tracks'?'globe':chipIc[i]],40)}${esc(c.title)}</div>`).join('')}</div>
        ${sig}</div>`; break; }
    case 'problem': {
      body = `<div class="slide prob">${top}<div class="txt">
        <h2>${esc(s.title)}</h2>
        ${(s.points||[]).map(p=>`<div class="pt"><span class="ic">${ico(I.x,40,'#A8B0D6')}</span>${esc(p)}</div>`).join('')}
        <div class="ans"><div><span>${esc(s.answer || 'الحل؟')} <span class="gt">«${esc(brand)}»</span></span><small>${esc(s.next || 'اسحب ←')}</small></div></div>
      </div>${sig}</div>`; break; }
    case 'shot': {
      const tilt = [-4, 3, -3][shotIdx % 3];
      body = `<div class="slide shot">${top}<div class="glow"></div>
        <div class="ph" style="transform:rotate(${tilt}deg)">${phone(s.shot)}</div>
        <div class="txt"><div class="num gt">${String(shotIdx+1).padStart(2,'0')}</div><h2>${esc(s.title)}</h2><div class="bar"></div><p class="sub">${esc(s.sub)}</p></div>
      ${sig}</div>`; break; }
    case 'tracks': {
      body = `<div class="slide trk">${top}<div class="txt">
        <h2>${esc(s.title).replace(/^(\d+)/,'<span class="gt">$1</span>')}</h2>
        ${(s.tracks||[]).map((t,i)=>`<div class="row"><span class="ic">${ico(I[trackIcon(t)],56)}</span><span class="nm">${esc(t)}</span><span class="ix">${String(i+1).padStart(2,'0')}</span></div>`).join('')}
        ${s.sub ? `<div class="note">${ico(I.info,36,'#00F5A0')}<span>${esc(s.sub)}</span></div>` : ''}
      </div>${sig}</div>`; break; }
    case 'cta': {
      const m = String(s.price||'').match(/^\s*([\d.,]+)\s*(.*)$/) || [null, s.price, ''];
      const bd = (s.bundles||[]).map(b => { const k = b.split(/\s+[—–-]\s+/); const pr = k.length>1 ? k.pop() : ''; return `<div class="bd"><span>${esc(k.join(' — '))}</span><span class="pr">${esc(pr)}</span></div>`; }).join('');
      body = `<div class="slide cta">${top}<div class="txt">
        <h2>${esc(s.title)}</h2>
        <div class="price"><span class="n gt">${esc(m[1])}</span><span class="cur">${esc(m[2])}</span></div>
        <div class="plbl">${esc(s.price_label || brand)}</div>
        <div class="bds">${bd}</div>
        <div class="go">${ico(I.send,52,'#fff')}${esc(s.cta)}</div>
        <div class="warn">${ico(I.info,30,'#A8B0D6')}<span>${esc(s.note)}</span></div>
      </div>${sig}</div>`; break; }
    default:
      body = `<div class="slide">${top}<div class="txt" style="position:absolute;top:300px;right:64px;left:64px"><h2 style="font-size:80px">${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p></div>${sig}</div>`;
  }
  document.getElementById('root').innerHTML = body;

  await Promise.all(Object.keys(W).map(w => document.fonts.load(`${w} 40px TajawalL`, 'مختبر').catch(()=>{})));
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => new Promise(r => { const fail = () => { const d = document.createElement('div'); d.className = 'miss'; d.textContent = im.dataset.n + '.png'; im.replaceWith(d); r(); }; if (im.complete) { im.naturalWidth ? r() : fail(); } else { im.onload = r; im.onerror = fail; } })));
  window.__fontsOk = document.fonts.check('800 40px TajawalL', 'مختبر');
  window.__ready = true;
})();
</script>
</body>
</html>
